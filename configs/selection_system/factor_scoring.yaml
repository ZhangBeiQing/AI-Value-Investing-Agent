schema_version: 1
description: "配置化因子评分：原始因子 -> 单因子分 -> 分股票类型分组分 -> short/long"

normalization:
  default_missing_score: 0.5

factors:
  pe_ttm: {direction: lower_better, positive_only: true}
  pb: {direction: lower_better, positive_only: true}
  ps: {direction: lower_better, positive_only: true}
  peg: {direction: lower_better, positive_only: true}
  pe_3_5y_percentile: {direction: lower_better}
  pe_current_vs_median: {direction: lower_better}
  pb_3_5y_percentile: {direction: lower_better}
  pb_current_vs_median: {direction: lower_better}
  price_position_3_5y: {direction: lower_better}
  price_percentile_3_5y: {direction: lower_better}
  price_bucket_index_3_5y: {direction: lower_better}

  roe: {direction: higher_better}
  gross_margin: {direction: higher_better}
  net_profit_margin: {direction: higher_better}
  revenue_growth_yoy: {direction: higher_better}
  net_income_growth_yoy: {direction: higher_better}
  deduct_net_income_growth_yoy: {direction: higher_better}

  return_3m: {direction: higher_better}
  return_6m: {direction: higher_better}
  return_1y: {direction: higher_better}
  sharpe_3m: {direction: higher_better}
  sharpe_6m: {direction: higher_better}
  sharpe_1y: {direction: higher_better}
  distance_to_52w_high: {direction: higher_better}
  ma_bullish_score: {direction: higher_better}
  macd: {direction: higher_better}
  rsi_14:
    direction: range_best
    ranges:
      - {min: 45, max: 65, score: 1.0}
      - {min: 35, max: 75, score: 0.7}
      - {min: 25, max: 85, score: 0.35}
    default_score: 0.15
  volume_ratio_5d_20d: {direction: higher_better}

  amount: {direction: higher_better}
  turnover_rate: {direction: higher_better}
  avg_turnover_30d: {direction: higher_better}
  liquidity_score: {direction: higher_better}

  max_drawdown_3m: {direction: higher_better}
  max_drawdown_6m: {direction: higher_better}
  max_drawdown_1y: {direction: higher_better}
  volatility_20d: {direction: lower_better}
  volatility_60d: {direction: lower_better}

  chip_profit_ratio:
    direction: higher_better
    type_configs:
      cyclical: {direction: lower_better}
  chip_concentration_70: {direction: lower_better}
  chip_concentration_90: {direction: lower_better}
  price_vs_chip_avg_cost:
    direction: higher_better
    type_configs:
      cyclical: {direction: lower_better}
  chip_support_distance_70:
    direction: higher_better
    type_configs:
      cyclical: {direction: lower_better}
  overhead_pressure_70: {direction: lower_better}
  overhead_pressure_90: {direction: lower_better}

score_groups:
  valuation_score:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        peg: 0.30
        pe_3_5y_percentile: 0.25
        pe_current_vs_median: 0.10
        price_position_3_5y: 0.10
        price_percentile_3_5y: 0.15
        price_bucket_index_3_5y: 0.10
      cyclical:
        pb_3_5y_percentile: 0.25
        pb_current_vs_median: 0.25
        price_position_3_5y: 0.25
        price_percentile_3_5y: 0.15
        price_bucket_index_3_5y: 0.10
      special:
        price_position_3_5y: 0.34
        price_percentile_3_5y: 0.33
        price_bucket_index_3_5y: 0.33
  quality_score:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        roe: 0.40
        gross_margin: 0.30
        net_profit_margin: 0.30
      cyclical:
        roe: 0.40
        gross_margin: 0.30
        net_profit_margin: 0.30
      special:
        gross_margin: 0.55
        net_profit_margin: 0.20
        roe: 0.25
  growth_score:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        revenue_growth_yoy: 0.30
        net_income_growth_yoy: 0.40
        deduct_net_income_growth_yoy: 0.30
      cyclical:
        revenue_growth_yoy: 0.20
        net_income_growth_yoy: 0.40
        deduct_net_income_growth_yoy: 0.40
      special:
        revenue_growth_yoy: 0.60
        net_income_growth_yoy: 0.25
        deduct_net_income_growth_yoy: 0.15
  trend_score:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        return_3m: 0.15
        return_6m: 0.16
        return_1y: 0.20
        sharpe_3m: 0.11
        sharpe_6m: 0.13
        sharpe_1y: 0.10
        ma_bullish_score: 0.15
      cyclical:
        return_3m: 0.3
        return_6m: 0.4
        return_1y: 0.1
        sharpe_3m: 0.1
        sharpe_6m: 0.1
        ma_bullish_score: 0.20
      special:
        return_3m: 0.24
        return_6m: 0.18
        return_1y: 0.12
        sharpe_3m: 0.18
        sharpe_6m: 0.10
        ma_bullish_score: 0.18
  technical_score:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        ma_bullish_score: 0.25
        macd: 0.25
        rsi_14: 0.25
        volume_ratio_5d_20d: 0.25
      cyclical:
        ma_bullish_score: 0.30
        macd: 0.25
        rsi_14: 0.20
        volume_ratio_5d_20d: 0.25
      special:
        ma_bullish_score: 0.25
        macd: 0.25
        rsi_14: 0.25
        volume_ratio_5d_20d: 0.25
  liquidity_factor_score:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        amount: 0.30
        turnover_rate: 0.25
        avg_turnover_30d: 0.20
        liquidity_score: 0.25
      cyclical:
        amount: 0.35
        turnover_rate: 0.20
        avg_turnover_30d: 0.20
        liquidity_score: 0.25
      special:
        amount: 0.30
        turnover_rate: 0.25
        avg_turnover_30d: 0.20
        liquidity_score: 0.25
  risk_drawdown_score:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        max_drawdown_3m: 0.25
        max_drawdown_6m: 0.20
        max_drawdown_1y: 0.20
        volatility_20d: 0.20
        volatility_60d: 0.15
      cyclical:
        max_drawdown_3m: 0.35
        max_drawdown_6m: 0.25
        max_drawdown_1y: 0.05
        volatility_20d: 0.20
        volatility_60d: 0.15
      special:
        max_drawdown_3m: 0.20
        max_drawdown_6m: 0.20
        max_drawdown_1y: 0.20
        volatility_20d: 0.20
        volatility_60d: 0.20
  chip_score:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        overhead_pressure_70: 0.25
        overhead_pressure_90: 0.10
        chip_concentration_70: 0.22
        chip_concentration_90: 0.12
        chip_profit_ratio: 0.10
        price_vs_chip_avg_cost: 0.10
        chip_support_distance_70: 0.11
      cyclical:
        chip_concentration_70: 0.25
        chip_concentration_90: 0.15
        overhead_pressure_70: 0.18
        overhead_pressure_90: 0.10
        chip_profit_ratio: 0.10
        price_vs_chip_avg_cost: 0.10
        chip_support_distance_70: 0.12
      special:
        chip_profit_ratio: 0.25
        chip_concentration_70: 0.20
        chip_concentration_90: 0.10
        price_vs_chip_avg_cost: 0.15
        chip_support_distance_70: 0.10
        overhead_pressure_70: 0.15
        overhead_pressure_90: 0.05
  money_flow_score: {}
  event_board_score: {}

short:
  gates:
    - {field: amount, min: 0.5, reason: "成交额过低"}
    - {field: liquidity_score, min: 0.05, reason: "流动性评分过低"}
  main_weights:
    trend_score: 0.00
    technical_score: 0.25
    liquidity_factor_score: 0.20
    risk_drawdown_score: 0.15
    chip_score: 0.15
    money_flow_score: 0.15
    event_board_score: 0.10

long:
  stock_type_field: stock_type
  default_stock_type: growth
  type_gates:
    growth:
      - {field: pe_ttm, positive: true, reason: "PE 为负或缺失"}
      - {field: peg, max: 4.0, allow_missing: true, reason: "PEG 高于 4"}
    cyclical:
      - {field: pb, positive: true, reason: "PB 缺失或无效"}
      - {field: pb_3_5y_percentile, max: 0.80, allow_missing: true, reason: "PB 历史分位过高"}
    special: []
  main_weights:
    stock_type_field: stock_type
    default_stock_type: growth
    type_weights:
      growth:
        quality_score: 0.18
        valuation_score: 0.22
        growth_score: 0.22
        trend_score: 0.12
        risk_drawdown_score: 0.12
        chip_score: 0.09
        event_board_score: 0.05
      cyclical:
        valuation_score: 0.30
        chip_score: 0.15
        quality_score: 0.10
        growth_score: 0.08
        trend_score: 0.18
        risk_drawdown_score: 0.12
        event_board_score: 0.07
      special:
        growth_score: 0.25
        trend_score: 0.20
        chip_score: 0.15
        quality_score: 0.10
        valuation_score: 0.10
        risk_drawdown_score: 0.10
        event_board_score: 0.10

combined:
  short_score: 0.5
  long_score: 0.5
